<!DOCTYPE html>
<html lang="en" class="game-embed-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=900">
    <meta name="description" content="Reactor Incremental game frame">
    <!-- Source base for Python files (overridden by build for production) -->
    <meta name="src-base" content="../implementation/src/">
    <link rel="icon" type="image/gif" href="mixy1.gif">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <title>nuclear.mixy1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="game-embed-body">
    <main>
        <div class="game-shell">
            <canvas id="game-canvas" width="900" height="630"></canvas>
        </div>

        <div id="loading">
            <div class="loading-icon-row">
                <img src="assets/sprites/Fuel1-1.png" alt="" class="loading-sprite">
                <img src="assets/sprites/Fuel3-1.png" alt="" class="loading-sprite">
                <img src="assets/sprites/Fuel5-1.png" alt="" class="loading-sprite">
                <img src="assets/sprites/Fuel7-1.png" alt="" class="loading-sprite">
                <img src="assets/sprites/Fuel9-1.png" alt="" class="loading-sprite">
            </div>
            <h1>Reactor Incremental</h1>
            <div id="loading-bar-container">
                <div id="loading-bar"></div>
            </div>
            <div id="loading-status">Initializing...</div>
        </div>

        <!-- Shown while time away is simulated (main.py, Renderer.showBusy) -->
        <div id="catch-up" hidden>
            <div class="catch-up-panel">
                <div class="loading-icon-row">
                    <img src="assets/sprites/Fuel1-1.png" alt="" class="loading-sprite">
                    <img src="assets/sprites/Fuel3-1.png" alt="" class="loading-sprite">
                    <img src="assets/sprites/Fuel5-1.png" alt="" class="loading-sprite">
                    <img src="assets/sprites/Fuel7-1.png" alt="" class="loading-sprite">
                    <img src="assets/sprites/Fuel9-1.png" alt="" class="loading-sprite">
                </div>
                <div class="catch-up-title">Catching up</div>
                <div class="catch-up-bar"><div id="catch-up-bar-fill"></div></div>
                <div id="catch-up-status"></div>
            </div>
        </div>
    </main>

    <!-- Hidden file input for save import -->
    <input type="file" id="file-input" accept=".txt,.json">

    <script>
        (function () {
            const SAVE_KEY = 'rev_reactor_save';
            const THEME_KEY = 'sprite-theme';
            const state = {
                ready: false,
                saveText: null,
                theme: 'default',
                bridgeToken: null,
                lastSaveAck: null,
            };
            let readyResolvers = [];
            let hostStateRetry = null;
            let pendingSaveWrite = null;
            let saveWriteSequence = 0;

            function normalizeTheme(theme) {
                return theme === 'decayed' ? 'decayed' : 'default';
            }

            function resolveReady() {
                if (readyResolvers.length === 0) return;
                for (const resolve of readyResolvers) {
                    resolve(true);
                }
                readyResolvers = [];
            }

            function markReady() {
                if (state.ready) return;
                state.ready = true;
                if (hostStateRetry !== null) {
                    clearInterval(hostStateRetry);
                    hostStateRetry = null;
                }
                resolveReady();
            }

            function requestHostState() {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ type: 'rev-reactor-host-state-request' }, '*');
                } else {
                    try {
                        state.saveText = localStorage.getItem(SAVE_KEY);
                        state.theme = normalizeTheme(localStorage.getItem(THEME_KEY));
                    } catch (_err) {
                        // Ignore unavailable localStorage in restricted contexts.
                    }
                    markReady();
                }
            }

            function postPendingSave() {
                if (!pendingSaveWrite || !state.bridgeToken) return;
                if (!window.parent || window.parent === window) return;
                window.parent.postMessage(
                    {
                        type: 'rev-reactor-save-write',
                        bridgeToken: state.bridgeToken,
                        writeId: pendingSaveWrite.writeId,
                        saveText: pendingSaveWrite.saveText,
                    },
                    '*'
                );
            }

            function downloadTextLocal(filename, text) {
                const safeName = typeof filename === 'string' && filename.trim()
                    ? filename.trim()
                    : 'rev_reactor_save.txt';
                const payload = typeof text === 'string' ? text : String(text ?? '');
                const blob = new Blob([payload], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = safeName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }

            window.RevReactorHostBridge = {
                waitUntilReady(timeoutMs = 2000) {
                    if (state.ready) return Promise.resolve(true);
                    return new Promise((resolve) => {
                        readyResolvers.push(resolve);
                        // A timeout is a prompt to retry, not permission to
                        // start with an empty save and overwrite durable state.
                        setTimeout(() => {
                            if (!state.ready) requestHostState();
                        }, timeoutMs);
                    });
                },
                getSaveText() {
                    return state.saveText;
                },
                setSaveText(text) {
                    state.saveText = String(text);
                    if (window.parent && window.parent !== window) {
                        saveWriteSequence += 1;
                        pendingSaveWrite = {
                            writeId: `${Date.now().toString(36)}-${saveWriteSequence.toString(36)}`,
                            saveText: state.saveText,
                        };
                        postPendingSave();
                        return;
                    }
                    try {
                        localStorage.setItem(SAVE_KEY, state.saveText);
                        state.lastSaveAck = {
                            accepted: true,
                            durable: true,
                            savedAt: Date.now(),
                        };
                    } catch (_err) {
                        state.lastSaveAck = {
                            accepted: true,
                            durable: false,
                            savedAt: Date.now(),
                        };
                    }
                },
                getSaveStatus() {
                    return {
                        pending: pendingSaveWrite !== null,
                        lastAck: state.lastSaveAck,
                    };
                },
                getTheme() {
                    return state.theme;
                },
                downloadText(filename, text) {
                    if (window.parent && window.parent !== window) {
                        window.parent.postMessage(
                            {
                                type: 'rev-reactor-download',
                                bridgeToken: state.bridgeToken,
                                filename,
                                text,
                            },
                            '*'
                        );
                        return true;
                    }
                    downloadTextLocal(filename, text);
                    return true;
                },
            };

            window.addEventListener('message', (ev) => {
                const data = ev.data;
                if (!data || typeof data !== 'object') return;

                if (data.type === 'rev-reactor-host-state') {
                    state.theme = normalizeTheme(data.theme);
                    state.saveText = typeof data.saveText === 'string' ? data.saveText : null;
                    state.bridgeToken = typeof data.bridgeToken === 'string'
                        ? data.bridgeToken
                        : null;
                    markReady();
                    return;
                }

                if (data.type === 'rev-reactor-save-ack') {
                    if (data.bridgeToken !== state.bridgeToken) return;
                    if (!pendingSaveWrite || data.writeId !== pendingSaveWrite.writeId) return;
                    state.lastSaveAck = {
                        accepted: data.accepted !== false,
                        durable: data.durable === true,
                        savedAt: Number(data.savedAt) || Date.now(),
                    };
                    pendingSaveWrite = null;
                    return;
                }

                if (data.type === 'rev-reactor-theme-set') {
                    state.theme = normalizeTheme(data.theme);
                    return;
                }

                if (data.type === 'rev-reactor-heartbeat-request') {
                    beat();
                }
            });

            function beat() {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage(
                        {
                            type: 'rev-reactor-beat',
                            bridgeToken: state.bridgeToken,
                            ts: Date.now(),
                        },
                        '*'
                    );
                }
            }

            requestHostState();
            if (window.parent && window.parent !== window && !state.ready) {
                // The child can load before the host installs its message
                // listener (notably with Safari's cached-page scheduling).
                // Retry until the host acknowledges with its persisted state.
                hostStateRetry = setInterval(() => {
                    if (state.ready) {
                        clearInterval(hostStateRetry);
                        hostStateRetry = null;
                        return;
                    }
                    requestHostState();
                }, 250);
            }
            beat();
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) beat();
            });
            setInterval(beat, 2000);
            setInterval(postPendingSave, 1000);
        })();
    </script>
    <script src="renderer.js"></script>
    <script src="input.js"></script>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.29.3/full/pyodide.js"></script>
    <script src="loader.js"></script>
</body>
</html>
