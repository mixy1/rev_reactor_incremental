<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=900">
    <meta name="description" content="Reactor Incremental reimplementation — nuclear.mixy1">
    <link rel="icon" type="image/gif" href="mixy1.gif">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <title>nuclear.mixy1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <a href="/" class="logo">
                <img src="assets/sprites/Fuel5-4.png" alt="" class="logo-sprite">
                <span>nuclear.</span><img src="mixy1.gif" alt="mixy1" class="logo-gif">
            </a>
            <nav class="nav-links">
                <a href="https://mixy.one" target="_blank" rel="noopener">mixy.one</a>
                <a href="https://github.com/mixy1" target="_blank" rel="noopener">GitHub</a>
                <a href="#changelog">Changelog</a>
                <button id="theme-toggle" class="theme-toggle-btn">Decayed</button>
            </nav>
        </div>
    </header>

    <main>
        <div class="game-shell">
            <iframe
                id="game-frame"
                class="game-frame"
                title="Reactor Incremental Game"
                src="game.html"
                data-base-src="game.html"
                loading="eager"
                scrolling="no"
                sandbox="allow-scripts"
                allowtransparency="true"
                referrerpolicy="same-origin"
            ></iframe>
            <p id="watchdog-status" class="game-watchdog-status" aria-live="polite"></p>
            <p id="save-status" class="game-save-status" aria-live="polite">Save: waiting for game…</p>
            <p class="game-attribution">
                Original game created by
                <a href="https://www.kongregate.com/en/games/cael/reactor-incremental" target="_blank" rel="noopener">cael</a>.
                This version is a Python reimplementation by
                <img src="mixy1.gif" alt="mixy1" class="inline-mixy-gif">.
            </p>
        </div>
    </main>

    <section id="changelog" class="changelog">
        <div class="changelog-content">
            <h2>Changelog</h2>
            <p class="changelog-subtitle">Generated from <code>git log</code> (newest first).</p>
            <div id="changelog-entries" class="changelog-entries">
                <p class="changelog-loading">Loading changelog...</p>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="footer-content">
            <div class="footer-left">
                <a href="https://mixy.one" target="_blank" rel="noopener" title="Visit mixy.one">
                    <img src="mixy1.gif" alt="mixy1" class="footer-mixy">
                </a>
                <span class="footer-text">reimplementation of my favourite game of all time</span>
            </div>
            <div class="footer-right">
                <a href="https://www.kongregate.com/en/games/cael/reactor-incremental" target="_blank" rel="noopener">
                    Reactor Incremental
                </a>
                <span class="footer-sep">by</span>
                <a href="https://www.kongregate.com/en/games/cael/reactor-incremental" target="_blank" rel="noopener">
                    cael
                </a>
            </div>
        </div>
    </footer>
    <script>
        (async function () {
            const host = document.getElementById('changelog-entries');
            if (!host) return;

            function setMessage(text, cls) {
                host.innerHTML = '';
                const p = document.createElement('p');
                p.className = cls;
                p.textContent = text;
                host.appendChild(p);
            }

            let entries;
            try {
                const resp = await fetch('changelog.json', { cache: 'no-cache' });
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                entries = await resp.json();
            } catch (_err) {
                setMessage('Failed to load changelog.', 'changelog-error');
                return;
            }

            if (!Array.isArray(entries)) {
                setMessage('Invalid changelog format.', 'changelog-error');
                return;
            }

            if (entries.length === 0) {
                setMessage('No changelog entries found.', 'changelog-empty');
                return;
            }

            entries = entries
                .map((entry) => ({
                    ts: String(entry.ts ?? ''),
                    message: String(entry.message ?? '')
                }))
                .filter((entry) => entry.ts && entry.message);

            entries.sort((a, b) => b.ts.localeCompare(a.ts));
            host.innerHTML = '';
            for (const entry of entries) {
                const article = document.createElement('article');
                article.className = 'changelog-entry';

                const dateEl = document.createElement('div');
                dateEl.className = 'changelog-date';
                dateEl.textContent = entry.ts;
                article.appendChild(dateEl);

                const messageEl = document.createElement('p');
                messageEl.className = 'changelog-message';
                messageEl.textContent = entry.message;
                article.appendChild(messageEl);

                host.appendChild(article);
            }
        })();
    </script>
    <script>
        (function () {
            const frame = document.getElementById('game-frame');
            const themeBtn = document.getElementById('theme-toggle');
            const statusEl = document.getElementById('watchdog-status');
            const saveStatusEl = document.getElementById('save-status');
            const SAVE_KEY = 'rev_reactor_save';
            const SAVE_BACKUP_KEY = 'rev_reactor_save_backup';
            const SAVE_WRITER_KEY = 'rev_reactor_save_writer';

            const CHECK_EVERY_MS = 1000;
            const HEARTBEAT_TIMEOUT_MS = 12000;
            const FIRST_BEAT_GRACE_MS = 60000;
            const RESUME_GRACE_MS = 60000;

            function createBridgeToken() {
                if (typeof crypto !== 'undefined' && crypto.getRandomValues) {
                    const values = new Uint32Array(4);
                    crypto.getRandomValues(values);
                    return Array.from(values, value => value.toString(36)).join('-');
                }
                return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;
            }

            const BRIDGE_TOKEN = createBridgeToken();

            let inMemorySaveText = null;

            function readLocalStorage(key) {
                try {
                    return localStorage.getItem(key);
                } catch (err) {
                    console.warn(`Storage read failed for ${key}:`, err);
                    return null;
                }
            }

            function writeLocalStorage(key, value) {
                try {
                    localStorage.setItem(key, value);
                    return true;
                } catch (err) {
                    console.warn(`Storage write failed for ${key}:`, err);
                    return false;
                }
            }

            function claimSaveWriter() {
                return writeLocalStorage(SAVE_WRITER_KEY, BRIDGE_TOKEN);
            }

            function canWriteSave() {
                const owner = readLocalStorage(SAVE_WRITER_KEY);
                if (owner === BRIDGE_TOKEN) return true;
                if (owner === null) {
                    // Either no owner exists or storage is unavailable. Claim
                    // when possible; otherwise retain the in-memory fallback.
                    claimSaveWriter();
                    return true;
                }
                return false;
            }

            let currentTheme = readLocalStorage('sprite-theme') === 'decayed' ? 'decayed' : 'default';
            let lastBeat = Date.now();
            let frameLoadAt = Date.now();
            let hasBeat = false;
            let restartCount = 0;
            let watchdogGraceUntil = frameLoadAt + FIRST_BEAT_GRACE_MS;
            let heartbeatProbeAt = 0;

            function setStatus(message) {
                if (!statusEl) return;
                statusEl.textContent = message;
            }

            function setSaveStatus(message, isError = false) {
                if (!saveStatusEl) return;
                saveStatusEl.textContent = message;
                saveStatusEl.classList.toggle('save-error', isError);
            }

            function applyThemeButton() {
                if (!themeBtn) return;
                themeBtn.classList.toggle('decayed-active', currentTheme === 'decayed');
                themeBtn.textContent = currentTheme === 'decayed' ? 'Default' : 'Decayed';
            }

            function postThemeToGame() {
                if (!frame.contentWindow) return;
                frame.contentWindow.postMessage(
                    { type: 'rev-reactor-theme-set', theme: currentTheme },
                    '*'
                );
            }

            function readSavedGame() {
                const candidates = [
                    readLocalStorage(SAVE_KEY),
                    readLocalStorage(SAVE_BACKUP_KEY),
                    inMemorySaveText,
                ];
                let newest = null;
                let newestTimestamp = -1;
                let newestTicks = -1;
                for (const text of candidates) {
                    if (typeof text !== 'string') continue;
                    try {
                        const parsed = JSON.parse(text);
                        const timestamp = Number(parsed.saved_at_unix_ms) || 0;
                        const ticks = Number(parsed.total_ticks) || 0;
                        if (timestamp > newestTimestamp
                                || (timestamp === newestTimestamp && ticks > newestTicks)) {
                            newest = text;
                            newestTimestamp = timestamp;
                            newestTicks = ticks;
                        }
                    } catch (_err) {
                        // Ignore corrupt candidates and use another snapshot.
                    }
                }
                if (newest !== null) {
                    inMemorySaveText = newest;
                }
                return newest;
            }

            function writeSavedGame(saveText) {
                if (typeof saveText !== 'string') {
                    return { accepted: false, durable: false };
                }
                try {
                    JSON.parse(saveText);
                } catch (_err) {
                    return { accepted: false, durable: false };
                }
                if (!canWriteSave()) {
                    return { accepted: false, durable: false };
                }
                inMemorySaveText = saveText;
                const backupWritten = writeLocalStorage(SAVE_BACKUP_KEY, saveText);
                const primaryWritten = writeLocalStorage(SAVE_KEY, saveText);
                return {
                    accepted: true,
                    durable: backupWritten || primaryWritten,
                };
            }

            function triggerDownload(filename, text) {
                const safeName = typeof filename === 'string' && filename.trim()
                    ? filename.trim()
                    : 'rev_reactor_save.txt';
                const payload = typeof text === 'string' ? text : String(text ?? '');
                const blob = new Blob([payload], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = safeName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }

            function postHostStateToGame() {
                if (!frame.contentWindow) return;
                frame.contentWindow.postMessage(
                    {
                        type: 'rev-reactor-host-state',
                        bridgeToken: BRIDGE_TOKEN,
                        theme: currentTheme,
                        saveText: readSavedGame(),
                    },
                    '*'
                );
            }

            function requestHeartbeat() {
                if (!frame.contentWindow) return;
                frame.contentWindow.postMessage(
                    { type: 'rev-reactor-heartbeat-request' },
                    '*'
                );
            }

            function setTheme(theme) {
                currentTheme = theme === 'decayed' ? 'decayed' : 'default';
                writeLocalStorage('sprite-theme', currentTheme);
                applyThemeButton();
                postThemeToGame();
            }

            function restartFrame(reason) {
                const baseSrc = frame.dataset.baseSrc || 'game.html';
                const url = new URL(baseSrc, window.location.href);
                url.searchParams.set('watchdog', Date.now().toString(36));
                frame.src = `${url.pathname}${url.search}${url.hash}`;

                restartCount += 1;
                hasBeat = false;
                frameLoadAt = Date.now();
                lastBeat = frameLoadAt;
                watchdogGraceUntil = frameLoadAt + FIRST_BEAT_GRACE_MS;
                heartbeatProbeAt = 0;
                setStatus(`Game restarted (${reason}). Count: ${restartCount}`);
            }

            window.addEventListener('message', (ev) => {
                const data = ev.data;
                if (!data || typeof data !== 'object') return;

                // Initial requests do not have a token yet. Always reply to
                // the known game iframe rather than exposing state to sender.
                if (data.type === 'rev-reactor-host-state-request') {
                    postHostStateToGame();
                    return;
                }

                // Safari can wrap sandboxed WindowProxy objects differently;
                // authenticate all post-handshake messages with a random token
                // instead of relying solely on strict proxy identity.
                if (data.bridgeToken !== BRIDGE_TOKEN) return;
                if (data.type === 'rev-reactor-beat') {
                    lastBeat = Date.now();
                    hasBeat = true;
                    heartbeatProbeAt = 0;
                    if (statusEl && statusEl.textContent) {
                        setStatus('');
                    }
                    return;
                }

                if (data.type === 'rev-reactor-save-write') {
                    const result = writeSavedGame(data.saveText);
                    const savedAt = Date.now();
                    if (!result.accepted) {
                        setSaveStatus('Save handled by another active game tab.');
                    } else if (result.durable) {
                        setSaveStatus(`Saved locally at ${new Date(savedAt).toLocaleTimeString()}`);
                    } else {
                        setSaveStatus(
                            'Save is only in memory — Safari is blocking persistent site storage.',
                            true
                        );
                    }
                    frame.contentWindow.postMessage(
                        {
                            type: 'rev-reactor-save-ack',
                            bridgeToken: BRIDGE_TOKEN,
                            writeId: data.writeId,
                            accepted: result.accepted,
                            durable: result.durable,
                            savedAt,
                        },
                        '*'
                    );
                    return;
                }

                if (data.type === 'rev-reactor-download') {
                    try {
                        triggerDownload(data.filename, data.text);
                    } catch (err) {
                        console.warn('Failed to download save data from iframe:', err);
                    }
                }
            });

            frame.addEventListener('load', () => {
                frameLoadAt = Date.now();
                lastBeat = frameLoadAt;
                hasBeat = false;
                watchdogGraceUntil = frameLoadAt + FIRST_BEAT_GRACE_MS;
                heartbeatProbeAt = 0;
                postHostStateToGame();
                postThemeToGame();
            });

            document.addEventListener('visibilitychange', () => {
                if (document.hidden) return;
                claimSaveWriter();
                // Hidden-page timers are throttled. Give the healthy iframe a
                // chance to answer before treating a stale heartbeat as a hang.
                const now = Date.now();
                lastBeat = now;
                watchdogGraceUntil = now + RESUME_GRACE_MS;
                heartbeatProbeAt = 0;
                requestHeartbeat();
            });
            window.addEventListener('focus', claimSaveWriter);

            if (themeBtn) {
                themeBtn.addEventListener('click', () => {
                    setTheme(currentTheme === 'decayed' ? 'default' : 'decayed');
                });
            }

            setInterval(() => {
                if (document.hidden) return;

                const now = Date.now();
                if (now < watchdogGraceUntil) return;
                if (!hasBeat) {
                    if (now - frameLoadAt > FIRST_BEAT_GRACE_MS) {
                        restartFrame('no heartbeat during startup');
                    }
                    return;
                }

                if (now - lastBeat > HEARTBEAT_TIMEOUT_MS) {
                    if (heartbeatProbeAt === 0) {
                        heartbeatProbeAt = now;
                        requestHeartbeat();
                        return;
                    }
                    if (now - heartbeatProbeAt > 5000) {
                        restartFrame('heartbeat timeout');
                    }
                }
            }, CHECK_EVERY_MS);

            applyThemeButton();
            if (!document.hidden) claimSaveWriter();
            postThemeToGame();
        })();
    </script>
</body>
</html>
